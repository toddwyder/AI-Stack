name: Bug report
description: Report a reproducible problem in AI-Stack.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please provide enough detail for someone else to reproduce it.

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact actions that produced the problem.
      placeholder: |
        1. Go to …
        2. Click …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What did you expect to happen?
      placeholder: The expected behavior was …
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: What happened instead?
      placeholder: The actual behavior was …
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you experience the problem?
      options:
        - PC
        - Pixel 8 Pro
        - Pixel Tablet
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity / priority
      description: How severe is the issue or how urgently should it be addressed?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Drag and drop screenshots or short screen recordings here, or paste their URLs.
      placeholder: Attach screenshots or recordings here.

  - type: textarea
    id: console-log
    attributes:
      label: Console log
      description: Paste any relevant console output.
      render: shell
      placeholder: Paste console output here.
